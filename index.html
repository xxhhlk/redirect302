<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>正在跳转</title>
<script>
(function () {
  var DEFAULT_TARGET = "https://github.com/xxhhlk";
  var ALLOWED_HOSTS = [];

  function pick() {
    var raw = "";
    try {
      var q = new URLSearchParams(location.search);
      raw = q.get("url") || q.get("u") || "";
      if (!raw && location.hash.length > 1) raw = location.hash.slice(1);
      raw = decodeURIComponent(raw);
    } catch (e) {
      raw = "";
    }
    raw = String(raw).trim();
    if (!raw) return DEFAULT_TARGET;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(raw)) raw = "https://" + raw.replace(/^\/+/, "");
    var u;
    try {
      u = new URL(raw);
    } catch (e) {
      return DEFAULT_TARGET;
    }
    if (u.protocol !== "http:" && u.protocol !== "https:") return DEFAULT_TARGET;
    if (ALLOWED_HOSTS.length && ALLOWED_HOSTS.indexOf(u.hostname) === -1) return DEFAULT_TARGET;
    return u.href;
  }

  var target = pick();
  window.REDIRECT_TARGET = target;
  document.write('<meta http-equiv="refresh" content="0;url=' + target.replace(/&/g, "&amp;").replace(/"/g, "&quot;") + '">');
  location.replace(target);
})();
</script>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --fg: #1f2329;
  --muted: #8a919e;
  --accent: #0064fa;
  --line: #e3e6eb;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.card {
  width: 100%;
  max-width: 420px;
  padding: 40px 32px;
  text-align: center;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 8px 28px rgba(15, 23, 42, .06);
}
.ring {
  width: 34px;
  height: 34px;
  margin: 0 auto 20px;
  border: 3px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
h1 {
  margin: 0 0 8px;
  font-size: 17px;
  font-weight: 600;
}
p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}
.target {
  display: block;
  margin: 18px 0 20px;
  padding: 10px 12px;
  overflow: hidden;
  font-size: 13px;
  color: var(--fg);
  text-overflow: ellipsis;
  white-space: nowrap;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
}
a {
  color: var(--accent);
  text-decoration: none;
}
a:hover { text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { .ring { animation-duration: 2.4s; } }
</style>
</head>
<body>
<main class="card">
  <div class="ring"></div>
  <h1>正在跳转</h1>
  <p>请稍候，页面正在前往目标地址</p>
  <code class="target" id="target"></code>
  <p>没有自动跳转？<a id="manual" href="#">手动前往</a></p>
</main>
<noscript>
  <main class="card">
    <h1>需要开启 JavaScript</h1>
    <p>当前浏览器已禁用 JavaScript，无法自动跳转，请手动访问目标地址。</p>
  </main>
</noscript>
<script>
(function () {
  var target = window.REDIRECT_TARGET || "#";
  var t = document.getElementById("target");
  var m = document.getElementById("manual");
  if (t) t.textContent = target;
  if (m) m.href = target;
})();
</script>
</body>
</html>
